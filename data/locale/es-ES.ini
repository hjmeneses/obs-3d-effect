Supersample.Description="Dibuja al doble de resolución y reduce: orillas más suaves y menos parpadeo en ángulos fuertes, a cambio de más GPU."
HideBack="Ocultar la cara trasera"
Direct="Dibujar directo (sin recorte)"
Direct.Description="Pinta la fuente con su perspectiva directamente en la escena, como BFX 3D Rotation: lo que gira hacia afuera se ve completo sin necesidad de margen. Debe ser el último filtro: uno que venga después lo vuelve a recortar."
