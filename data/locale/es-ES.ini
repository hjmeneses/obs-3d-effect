KeepSize.Description="El campo de visión ya no cambia el tamaño de la fuente sin girar (como la perspectiva de CSS), y la Posición X/Y/Z va en pixeles reales de la fuente, sin depender de la Escala."
Margin="Margen"
Margin.Description="Espacio extra alrededor de la fuente, en porcentaje de su tamaño por lado, para que lo que gira fuera del recuadro no se corte. La fuente crece en la escena."
